<section class="ig" aria-labelledby="ig-title" scrollReveal>

  <header class="header">
    <p class="eyebrow font-ui">INSTAGRAM</p>
    <h2 id="ig-title" class="title font-display">&#64;{{ handle }}</h2>
    <p class="lede font-ui">
      Mirá las piezas en piel real. Así se enamoran muchas.
    </p>
  </header>

  <div class="grid">
    @for (post of posts; track post.id; let i = $index) {
      <a
        class="tile"
        [href]="post.url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="post.caption + ' en Instagram'"
        [style.--i]="i"
      >
        <div class="tile-media" aria-hidden="true">
          <svg viewBox="0 0 200 200" class="tile-svg">
            <defs>
              <radialGradient [id]="'ig-g-' + post.id" cx="50%" cy="40%" r="70%">
                <stop offset="0%" stop-color="rgba(223,184,116,0.35)" />
                <stop offset="100%" stop-color="rgba(223,184,116,0)" />
              </radialGradient>
            </defs>
            <rect width="200" height="200" [attr.fill]="'url(#ig-g-' + post.id + ')'" />

            @switch (post.id) {
              @case (1) {
                <g transform="translate(100 100)" stroke="#DFB874" stroke-width="1.6" fill="none">
                  <ellipse rx="50" ry="22" />
                  <ellipse rx="38" ry="14" opacity="0.6" />
                </g>
              }
              @case (2) {
                <g stroke="#DFB874" stroke-width="1.4" fill="none">
                  <path d="M40 60 Q100 30 160 60 L150 130 Q100 145 50 130 Z" opacity="0.85" />
                  <circle cx="100" cy="155" r="6" fill="#DFB874" />
                </g>
              }
              @case (3) {
                <g transform="translate(100 100)" stroke="#DFB874" stroke-width="1.5" fill="none">
                  <circle r="42" />
                  <circle r="26" opacity="0.55" />
                </g>
              }
              @case (4) {
                <g stroke="#DFB874" stroke-width="1.4" fill="none" transform="translate(100 100)">
                  <path d="M-52 8 Q0 -16 52 8 Q0 32 -52 8 Z" />
                </g>
              }
              @case (5) {
                <g stroke="#DFB874" stroke-width="1.3" fill="none">
                  <path d="M30 70 Q100 50 170 70" />
                  <path d="M30 70 Q60 130 100 140 Q140 130 170 70" />
                  <text x="93" y="115" fill="#DFB874" font-size="18">✦</text>
                </g>
              }
              @default {
                <g stroke="#DFB874" stroke-width="1.4" fill="none" transform="translate(100 100)">
                  <path d="M-60 0 Q-30 -22 0 0 Q30 22 60 0" />
                  <path d="M-60 0 Q-30 22 0 0 Q30 -22 60 0" opacity="0.6" />
                </g>
              }
            }
          </svg>

          <div class="tile-overlay">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/>
            </svg>
          </div>
        </div>
      </a>
    }
  </div>

  <a
    class="follow font-ui"
    [href]="profileUrl"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Seguinos en Instagram"
  >
    <span>SEGUINOS EN INSTAGRAM</span>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

</section>
