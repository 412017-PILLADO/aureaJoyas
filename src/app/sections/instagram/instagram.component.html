<section class="ig" aria-labelledby="ig-title" scrollReveal>

  <header class="header">
    <p class="eyebrow font-ui">INSTAGRAM</p>
    <h2 id="ig-title" class="title font-display">&#64;{{ handle }}</h2>
    <p class="lede font-ui">
      Mirá las piezas en piel real. Así se enamoran muchas.
    </p>
  </header>

  <div class="grid">
    @for (permalink of permalinks; track $index) {
      <blockquote
        class="instagram-media"
        data-instgrm-captioned
        [attr.data-instgrm-permalink]="embedUrl(permalink)"
        data-instgrm-version="14"
        style="background:#FFF;border:0;border-radius:3px;box-shadow:0 0 1px 0 rgba(0,0,0,0.5),0 1px 10px 0 rgba(0,0,0,0.15);margin:0;max-width:540px;min-width:326px;padding:0;width:100%;">
      </blockquote>
    }
  </div>

  <a
    class="follow font-ui"
    [href]="profileUrl"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Seguinos en Instagram"
  >
    <span>SEGUINOS EN INSTAGRAM</span>
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

</section>
