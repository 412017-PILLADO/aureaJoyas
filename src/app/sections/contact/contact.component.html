<section class="contact" aria-labelledby="contact-title" scrollReveal>
  <div class="inner">
    <p class="eyebrow font-ui">HABLEMOS</p>
    <h2 id="contact-title" class="title font-display">
      ¿Te enamoraste<br>de una pieza?
    </h2>
    <p class="lede font-ui">
      Escribinos por el canal que prefieras. Te respondemos siempre.
    </p>

    <ul class="ctas" role="list">
      <li class="cta-item" [style.--i]="0">
        <a
          class="cta font-ui"
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Escribirnos por WhatsApp"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3.7-7.3L21 4l-1 3.6A9 9 0 0 1 21 12z"/>
            <path d="M8 11c.5 2 2 3.5 4 4l1.5-1.2 2.5 1c-.3 1.5-1.8 2.5-3.5 2.2C9 16.5 6.5 14 6 11c-.3-1.7.7-3.2 2.2-3.5l1 2.5L8 11z"/>
          </svg>
          <span>WhatsApp</span>
          <svg class="arrow" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>

      <li class="cta-item" [style.--i]="1">
        <a
          class="cta font-ui"
          [href]="instagramUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Vernos en Instagram"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/>
          </svg>
          <span>Instagram</span>
          <svg class="arrow" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>

      <li class="cta-item" [style.--i]="2">
        <a
          class="cta font-ui"
          [href]="storeUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visitar nuestra tienda online"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l1.5-5h15L21 9"/>
            <path d="M4 9v11h16V9"/>
            <path d="M9 20v-6h6v6"/>
          </svg>
          <span>Tienda</span>
          <svg class="arrow" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
    </ul>
  </div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <div class="brand">
      <span class="brand-name font-display">Aurea Terra</span>
      <span class="brand-tag font-script">joyas</span>
    </div>
    <p class="copyright font-ui">© {{ year }} Aurea Terra Joyas · Todos los derechos reservados</p>
  </div>
</footer>
